<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./login-form-5.css">
</head>

<body>

    <form class="login">
        <h2>Registration</h2>
        <fieldset>
            <legend>Login Information</legend>

            <p class="field">
                <input type="email" id="email" required>
                <label for="email">Email</label>
                <span class="helper-text">example: nachevalexandar.a@gmail.com</span>
            </p>

            <p class="field">
                <input type="password" id="password" required>
                <label for="password">Password</label>
                <span class="helper-text">minimum 6 chars,letters and numbers,at least 1 special char</span>
            </p>

        </fieldset>

        <fieldset>
            <legend>Aditional Information</legend>

            <p class="field">
                <input type="datetime-local" id="date" required>
                <label for="date">Date of Birth</label>
                <span class="helper-text">example: 01/01/1990</span>
            </p>
        </fieldset>

        <input type="submit" value="Login">
    </form>

</body>

</html>
