<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./login-form-8.css">
</head>

<body>

    <form class="login">
        <fieldset>
            <legend>Login</legend>

            <p class="field">
                <input type="email" id="email" required>
                <label for="email">Email</label>
                <span class="helper-text">example: nachevalexandar.a@gmail.com</span>
            </p>

            <p class="field">
                <input type="password" id="password" required>
                <label for="password">Password</label>
                <span class="helper-text">minimum 6 chars,letters and numbers,at least 1 special char</span>
            </p>

            <input type="submit" value="Login">
        </fieldset>
    </form>

</body>

</html>
