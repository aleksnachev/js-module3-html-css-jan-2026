<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h2>The Form Element</h2>
    <div>The form element represents a document section containing interactive controls for submitting information.
    </div>

    <h3>Attribute - method="get" (default)</h3>
    <div>Form data appended to the action URL with a ? separator.</div>

    <section class="code">

    </section>

    <form action="" method="get">
        <input type="search" name="" id="">
    </form>

    <h3>Attribute - method="post" (default)</h3>
    <div>Form data sent as the request body.</div>

    <section class="code">
        <code>
            <form action="" method="post">
                <input type="search" name="" id="">
            </form>    
        </code>
    </section>

    <form action="" method="post">
        <input type="search">
    </form>
</body>

</html>
